# Pushing a tag like v1.2.0 builds PixelPeek and submits that version to the Chrome Web Store for review.
name: Publish to Chrome Web Store

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $version"; exit 1
          fi

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Package
        run: cd dist && zip -r "../pixelpeek-${GITHUB_REF_NAME#v}.zip" .

      - name: Upload and submit for review
        env:
          CWS_SERVICE_ACCOUNT: ${{ secrets.CWS_SERVICE_ACCOUNT }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: node scripts/cws-publish.mjs "pixelpeek-${GITHUB_REF_NAME#v}.zip"

      - name: Attach the package to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "pixelpeek-${GITHUB_REF_NAME#v}.zip" --title "PixelPeek $GITHUB_REF_NAME" --generate-notes
